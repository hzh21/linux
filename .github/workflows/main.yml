name: Build is10 Kernel with Modules

on:
  push:
    branches: [ "histb" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu python3 rsync kmod tar

      - name: Build Kernel, DTBs and Modules
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export INSTALL_MOD_PATH=../output_modules  # 模块安装路径
          
          # 1. 生成配置
          make is10.config
          
          # 2. 编译内核和设备树
          make -j$(nproc) Image.gz dtbs
          
          # 3. 编译模块
          make -j$(nproc) modules
          
          # 4. 安装模块到临时目录
          mkdir -p $INSTALL_MOD_PATH
          make modules_install
          
          # 5. 打包模块文件方便下载
          tar -czf is10-modules.tar.gz -C $INSTALL_MOD_PATH .

      - name: Upload Kernel and DTBs
        uses: actions/upload-artifact@v4
        with:
          name: is10-kernel-and-dtbs
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/**/*.dtb

      - name: Upload Modules Package
        uses: actions/upload-artifact@v4
        with:
          name: is10-modules
          path: is10-modules.tar.gz
